  <title id="title">The geometry of selection — a research companion</title>
  <desc id="desc">An editorial cover for the Overview, with an abstract wireframe polytope and a highlighted vertex. Chapters: origin, construction, evidence, and source documents. The geometry is illustrative.</desc>
