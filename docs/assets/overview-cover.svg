  <text x="52" y="261" fill="#f4efe5" font-family="Georgia, 'Times New Roman', serif" font-size="74">of selection.</text>
  <text x="55" y="312" fill="#b9cbd0" font-family="Arial, sans-serif" font-size="23">An illustrated companion to the research note.</text>
