<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">An absent corner. An operational idea. The corrected short note.</title>
  <desc id="desc">A companion cover for the original categorical note. An incomplete wireframe cube illustrates the absent coexponential corner as a metaphor, not a mathematical polytope construction.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091924"/><stop offset="1" stop-color="#162f38"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#c49c59" stop-opacity=".16"/><stop offset="1" stop-color="#c49c59" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="460" rx="8" fill="url(#bg)"/>
  <ellipse cx="974" cy="210" rx="240" ry="215" fill="url(#light)"/>
  <path d="M52 53H96" stroke="#d9b77b" stroke-width="3"/>
  <text x="114" y="60" fill="#d9b77b" font-family="Arial, sans-serif" font-size="17" letter-spacing="3">THE SHORT RESEARCH NOTE</text>
  <text x="52" y="175" fill="#f4efe5" font-family="Georgia, 'Times New Roman', serif" font-size="65">An absent corner.</text>
  <text x="52" y="251" fill="#f4efe5" font-family="Georgia, 'Times New Roman', serif" font-size="65">An operational idea.</text>
  <text x="55" y="305" fill="#b9cbd0" font-family="Arial, sans-serif" font-size="23">Categorical analogy meets optimization.</text>
  <g fill="none" stroke-width="1.6" stroke-linejoin="round">
    <path d="M895 117L1030 85L1131 174L995 209Z" stroke="#77949d"/>
    <path d="M895 117V272L995 361L1131 326V174M995 209V361" stroke="#afc3c8"/>
    <path d="M895 272L1030 240L1131 326M1030 85V240" stroke="#55727d" stroke-dasharray="5 7"/>
    <path d="M895 117L983 198M1007 206L1131 174M995 225V361" stroke="#d9b77b" stroke-width="2.5"/>
    <circle cx="995" cy="209" r="12" stroke="#d9b77b" stroke-width="2" stroke-dasharray="3 4"/>
  </g>
  <g fill="#b8c8c8"><circle cx="895" cy="117" r="4"/><circle cx="1030" cy="85" r="4"/><circle cx="1131" cy="174" r="4"/><circle cx="895" cy="272" r="4"/><circle cx="995" cy="361" r="4"/><circle cx="1131" cy="326" r="4"/></g>
  <path d="M52 377H1148" stroke="#77929a" stroke-opacity=".35"/>
  <text x="52" y="420" fill="#d9b77b" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">COEXPONENTIALS / EXTREMAL SELECTION / FISHER CONTROL</text>
</svg>
